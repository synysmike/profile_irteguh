services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: profile_app
        restart: unless-stopped
        working_dir: /var/www/html
        dns:
            - 8.8.8.8
            - 1.1.1.1
        volumes:
            - ./:/var/www/html
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
            - ${HOME}/.config/gh:/var/www/.config/gh:ro
        ports:
            - "4240:80"
        networks:
            - profile_network
        depends_on:
            - mysql
        environment:
            - HOME=/var/www
            - GH_CONFIG_DIR=/var/www/.config/gh-runtime
            - APP_ENV=local
            - DB_CONNECTION=mysql
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=profile_db
            - DB_USERNAME=profile_user
            - DB_PASSWORD=profile_password

    mysql:
        image: mysql:8.0
        container_name: profile_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: profile_db
            MYSQL_USER: profile_user
            MYSQL_PASSWORD: profile_password
            MYSQL_ROOT_PASSWORD: root_password
        ports:
            - "4241:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - profile_network

volumes:
    mysql_data:

networks:
    profile_network:
